<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<meta content="mobile_tab" name="shell-type">
<title>BabyHealth Guard — Danger Signs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
@layer base{
  html,body{width:100vw;margin:0;padding:0;background-color:#faf8ff;}
  body{overscroll-behavior:none;color:#131b2e;font-family:'Inter',sans-serif;}
  .pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}
  .pt-safe{padding-top:env(safe-area-inset-top,0px);}
  main>:first-child{margin-top:0!important;}
  main>:last-child{margin-bottom:0!important;}
}
::-webkit-scrollbar{display:none;}
body {
  min-height: max(884px, 100dvh);
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      "colors": {
        "surface": "#faf8ff",
        "tertiary-fixed-dim": "#ffb2b7",
        "on-error-container": "#93000a",
        "primary-fixed": "#b9eaff",
        "surface-dim": "#d2d9f4",
        "inverse-primary": "#81d1f0",
        "on-tertiary-fixed": "#40000d",
        "tertiary": "#a80032",
        "secondary-container": "#57dffe",
        "on-surface": "#131b2e",
        "inverse-on-surface": "#eef0ff",
        "primary-container": "#0e7490",
        "on-tertiary-fixed-variant": "#92002a",
        "tertiary-fixed": "#ffdadb",
        "secondary-fixed-dim": "#4cd7f6",
        "error": "#ba1a1a",
        "on-background": "#131b2e",
        "on-primary-fixed-variant": "#004d62",
        "on-secondary-fixed": "#001f26",
        "error-container": "#ffdad6",
        "inverse-surface": "#283044",
        "surface-container-highest": "#dae2fd",
        "secondary-fixed": "#acedff",
        "on-tertiary-container": "#ffe7e7",
        "secondary": "#00687a",
        "surface-bright": "#faf8ff",
        "surface-tint": "#006781",
        "outline": "#6f787d",
        "surface-container-lowest": "#ffffff",
        "on-surface-variant": "#3f484c",
        "on-primary-fixed": "#001f29",
        "on-primary-container": "#d3f1ff",
        "primary": "#005a71",
        "outline-variant": "#bec8cd",
        "surface-variant": "#dae2fd",
        "on-tertiary": "#ffffff",
        "tertiary-container": "#ce2046",
        "primary-fixed-dim": "#81d1f0",
        "surface-container-low": "#f2f3ff",
        "on-error": "#ffffff",
        "on-secondary-fixed-variant": "#004e5c",
        "surface-container-high": "#e2e7ff",
        "surface-container": "#eaedff",
        "on-primary": "#ffffff",
        "background": "#faf8ff",
        "on-secondary": "#ffffff",
        "on-secondary-container": "#006172"
      },
      "borderRadius": {
        "DEFAULT": "0.125rem",
        "lg": "0.5rem",
        "xl": "1rem",
        "2xl": "1.5rem",
        "3xl": "2rem",
        "full": "9999px"
      },
      "spacing": {
        "space-lg": "1.5rem",
        "margin-desktop": "2rem",
        "gutter": "1rem",
        "space-xs": "0.25rem",
        "gutter-desktop": "1.5rem",
        "space-xl": "2rem",
        "space-sm": "0.5rem",
        "margin": "1rem",
        "space-md": "1rem"
      },
      "fontFamily": {
        "headline-sm": ["Inter"],
        "data-metric": ["Inter"],
        "headline-xl-mobile": ["Inter"],
        "headline-md": ["Inter"],
        "label-md": ["Inter"],
        "headline-xl": ["Inter"],
        "label-sm": ["Inter"],
        "body-md": ["Inter"],
        "headline-lg-mobile": ["Inter"],
        "label-lg": ["Inter"],
        "body-lg": ["Inter"],
        "body-sm": ["Inter"],
        "headline-lg": ["Inter"]
      }
    }
  }
};
</script>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen antialiased">

<!-- Header -->
<header class="fixed top-0 w-full z-50 pt-safe bg-surface/90 backdrop-blur-xl">
  <div class="h-16 px-5 flex items-center justify-between max-w-md mx-auto">
    <a class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface active:scale-95 transition-transform" href="dashboard_preview.html">
      <span class="material-symbols-outlined text-[22px]">arrow_back</span>
    </a>
    <div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container border border-outline-variant/40">
      <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
      <span class="text-[11px] font-semibold text-primary tracking-wide uppercase">24/7 Priority</span>
    </div>
    <button onclick="alert('Priority Line Active: Midwife and emergency dispatcher on standby 24/7.')" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface active:scale-95 transition-transform" type="button">
      <span class="material-symbols-outlined text-[20px]">notifications</span>
    </button>
  </div>
</header>

<!-- Main Danger Signs Content -->
<main class="flex flex-col relative w-full px-5 pt-20 pb-28 bg-surface min-h-screen justify-between max-w-md mx-auto">
  <div class="flex flex-col w-full">
    <!-- Title Header -->
    <div class="mt-2 mb-6">
      <h1 class="text-2xl font-bold tracking-tight text-on-surface">Danger Signs</h1>
      <p class="text-sm text-on-surface-variant font-medium mt-1">Tap if you feel any of these</p>
    </div>

    <!-- 4 Clean Large Visual Cards Grid -->
    <div class="grid grid-cols-2 gap-3.5">
      <!-- Card 1: Bleeding -->
      <button onclick="handleDangerAlert('Bleeding', 'Vaginal bleeding during pregnancy requires immediate clinical review.')" class="flex flex-col items-center justify-center p-5 rounded-3xl bg-surface-container-low hover:bg-surface-container border border-outline-variant/30 shadow-sm active:scale-[0.98] transition-all text-center group cursor-pointer" type="button">
        <div class="w-16 h-16 rounded-2xl bg-surface-container-lowest shadow-sm flex items-center justify-center text-primary-container mb-3.5 group-hover:scale-105 transition-transform">
          <span class="material-symbols-outlined text-[34px]">water_drop</span>
        </div>
        <span class="text-base font-bold text-on-surface tracking-tight leading-snug">Bleeding</span>
        <span class="text-xs text-on-surface-variant font-medium mt-0.5">Any blood</span>
      </button>

      <!-- Card 2: Severe Headache -->
      <button onclick="handleDangerAlert('Severe Headache', 'Severe headache with blurry vision may indicate elevated blood pressure.')" class="flex flex-col items-center justify-center p-5 rounded-3xl bg-surface-container-low hover:bg-surface-container border border-outline-variant/30 shadow-sm active:scale-[0.98] transition-all text-center group cursor-pointer" type="button">
        <div class="w-16 h-16 rounded-2xl bg-surface-container-lowest shadow-sm flex items-center justify-center text-primary-container mb-3.5 group-hover:scale-105 transition-transform">
          <span class="material-symbols-outlined text-[34px]">visibility_off</span>
        </div>
        <span class="text-base font-bold text-on-surface tracking-tight leading-snug">Severe Headache</span>
        <span class="text-xs text-on-surface-variant font-medium mt-0.5">Blurry vision</span>
      </button>

      <!-- Card 3: Baby Not Moving -->
      <button onclick="handleDangerAlert('Baby Not Moving', 'Noticeably reduced fetal kicks should be checked immediately by your midwife.')" class="flex flex-col items-center justify-center p-5 rounded-3xl bg-surface-container-low hover:bg-surface-container border border-outline-variant/30 shadow-sm active:scale-[0.98] transition-all text-center group cursor-pointer" type="button">
        <div class="w-16 h-16 rounded-2xl bg-surface-container-lowest shadow-sm flex items-center justify-center text-primary mb-3.5 group-hover:scale-105 transition-transform">
          <span class="material-symbols-outlined text-[34px]">child_care</span>
        </div>
        <span class="text-base font-bold text-on-surface tracking-tight leading-snug">Baby Not Moving</span>
        <span class="text-xs text-on-surface-variant font-medium mt-0.5">Fewer kicks</span>
      </button>

      <!-- Card 4: High Fever -->
      <button onclick="handleDangerAlert('High Fever', 'High fever or severe chills could indicate maternal infection.')" class="flex flex-col items-center justify-center p-5 rounded-3xl bg-surface-container-low hover:bg-surface-container border border-outline-variant/30 shadow-sm active:scale-[0.98] transition-all text-center group cursor-pointer" type="button">
        <div class="w-16 h-16 rounded-2xl bg-surface-container-lowest shadow-sm flex items-center justify-center text-secondary mb-3.5 group-hover:scale-105 transition-transform">
          <span class="material-symbols-outlined text-[34px]">thermostat</span>
        </div>
        <span class="text-base font-bold text-on-surface tracking-tight leading-snug">High Fever</span>
        <span class="text-xs text-on-surface-variant font-medium mt-0.5">Hot or chills</span>
      </button>
    </div>
  </div>

  <!-- Emergency Help Card -->
  <div class="mt-8 mb-2">
    <div class="rounded-3xl bg-surface-container-low border border-outline-variant/30 p-5 shadow-sm flex flex-col items-center text-center">
      <a class="w-full py-4 px-5 rounded-2xl bg-primary-container text-white font-semibold flex items-center justify-center gap-3 shadow-md active:scale-[0.99] transition-transform hover:opacity-95" href="tel:0800100200">
        <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
          <span class="material-symbols-outlined text-[20px]">call</span>
        </div>
        <span class="text-base tracking-wide">Call Midwife Now (Free)</span>
      </a>
      <div class="mt-3.5 flex items-center gap-1.5 text-xs text-on-surface-variant font-medium">
        <span class="material-symbols-outlined text-[16px] text-primary-container">dialpad</span>
        <span>Or dial <strong class="text-on-surface font-semibold">*920#</strong> with no internet</span>
      </div>
    </div>
  </div>
</main>

<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,0,0,0.05)]">
  <div class="flex justify-around items-center h-20 px-space-xs max-w-md mx-auto">
    <a class="flex flex-col items-center justify-center min-w-[64px] min-h-[48px] py-1 px-2 rounded-xl text-on-surface-variant hover:text-on-surface transition-all gap-0.5" data-path="home" href="dashboard_preview.html">
      <span class="material-symbols-outlined text-[24px]">home</span>
      <span class="font-label-sm text-label-sm">Home</span>
    </a>
    <a class="flex flex-col items-center justify-center min-w-[64px] min-h-[48px] py-1 px-2 rounded-xl text-on-surface-variant hover:text-on-surface transition-all gap-0.5" data-path="my-health" href="my_health_preview.html">
      <span class="material-symbols-outlined text-[24px]">vital_signs</span>
      <span class="font-label-sm text-label-sm">My Health</span>
    </a>
    <a aria-current="page" class="flex flex-col items-center justify-center min-w-[64px] min-h-[48px] py-1 px-2 rounded-xl transition-all gap-0.5 text-primary-container font-bold" data-path="warning-signs" href="danger_signs_preview.html">
      <span class="material-symbols-outlined text-[24px]">health_and_safety</span>
      <span class="font-label-sm text-label-sm">Warning Signs</span>
    </a>
    <a class="flex flex-col items-center justify-center min-w-[64px] min-h-[48px] py-1 px-2 rounded-xl text-on-surface-variant hover:text-on-surface transition-all gap-0.5" data-path="visits" href="dashboard_preview.html">
      <span class="material-symbols-outlined text-[24px]">event_available</span>
      <span class="font-label-sm text-label-sm">Visits</span>
    </a>
  </div>
</nav>

<script>
  function handleDangerAlert(signName, message) {
    if (confirm("⚠️ URGENT: " + signName.toUpperCase() + "\n\n" + message + "\n\nDo you want to call your assigned midwife now (0800 100 200)?")) {
      window.location.href = "tel:0800100200";
    }
  }
</script>

</body>
</html>
