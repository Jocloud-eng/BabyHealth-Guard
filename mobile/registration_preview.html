<!DOCTYPE html>
<html lang="en">
<head>

        "on-tertiary-container": "#ffe7e7",
        "on-primary-fixed-variant": "#004d62",
        "on-secondary": "#ffffff",
        "outline-variant": "bec8cd",
        "surface-dim": "#d2d9f4",
        "tertiary-fixed-dim": "#ffb2b7",
        "secondary-fixed-dim": "#4cd7f6",
        "surface-bright": "#faf8ff",
        "inverse-on-surface": "#eef0ff",
        "inverse-primary": "#81d1f0",

<body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col">

<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe">
  <div class="h-16 px-gutter flex items-center justify-between max-w-md mx-auto">
    <div class="flex items-center gap-space-sm">
      <a aria-label="Go back" class="w-11 h-11 flex items-center justify-center rounded-lg text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors" href="welcome_preview.html">
        <span class="material-symbols-outlined text-[20px]">arrow_back</span>
      </a>
      <div class="flex flex-col">
        <span class="text-label-sm font-label-sm text-primary tracking-wider uppercase">BabyHealth Guard</span>
        <h1 class="text-headline-sm font-headline-sm text-on-surface leading-tight">Maternal Profile Details</h1>
      </div>
    </div>
    <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0">
      <span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
    </div>
  </div>
</header>

<main class="flex-1 flex flex-col relative w-full pt-16 bg-surface px-margin pb-safe max-w-md mx-auto">
  <div class="flex flex-col w-full pb-2">
    <div class="pt-4 pb-2">
      <h2 class="text-headline-lg font-headline-lg text-on-surface">Create Profile</h2>
      <p class="text-body-sm font-body-sm text-on-surface-variant mt-1">Free for all mothers</p>
    </div>

    <form id="registration-form" class="flex flex-col gap-space-md w-full mt-2">
      <div class="flex flex-col gap-space-md w-full">

        <!-- Photo Section -->
        <section class="bg-surface-container-lowest rounded-2xl p-space-md shadow-sm flex flex-col gap-space-md border border-outline/20">
          <div class="flex items-center gap-space-md">
            <input type="file" id="photo-file-input" accept="image/*" class="hidden">
            <div id="photo-preview-container" class="relative w-16 h-16 rounded-full bg-surface-container-low border border-primary/30 flex items-center justify-center text-primary shrink-0 shadow-sm cursor-pointer overflow-hidden" onclick="document.getElementById('photo-file-input').click()">
              <img id="photo-preview-img" class="w-full h-full object-cover hidden" alt="Uploaded Profile Photo">
              <span id="photo-placeholder-icon" class="material-symbols-outlined text-[28px]">add_a_photo</span>
            </div>
            <div class="flex flex-col flex-1">
              <button type="button" onclick="document.getElementById('photo-file-input').click()" class="text-label-md font-label-md text-primary font-semibold flex items-center gap-1 text-left">
                <span id="photo-btn-text">Add Your Photo (Optional)</span>
                <span class="material-symbols-outlined text-[16px]">photo_camera</span>
              </button>
              <span class="text-body-sm font-body-sm text-on-surface-variant mt-0.5">Helps midwives recognize you at the clinic</span>
            </div>
          </div>
        </section>

        <!-- Personal Details Section -->
        <section class="bg-surface-container-lowest rounded-2xl p-space-md shadow-sm flex flex-col gap-space-md border border-outline/20">
          <div class="flex items-center justify-between pb-1 border-b border-outline/20">
            <span class="text-label-sm font-label-sm uppercase tracking-wider text-primary font-semibold">Personal Details</span>
          </div>

          <div class="flex flex-col gap-1.5">
            <label class="text-label-md font-label-md text-on-surface" for="mother-name">Full Name</label>
            <div class="flex items-center bg-surface-container-low rounded-xl px-space-md h-12 shadow-sm focus-within:bg-surface-container-high transition-colors">
              <span class="material-symbols-outlined text-primary text-[20px] mr-space-sm shrink-0">person</span>
              <input class="w-full bg-transparent text-body-lg font-body-lg text-on-surface placeholder:text-outline focus:outline-none" id="mother-name" placeholder="e.g. Amina Brenda" type="text" value="Amina Brenda" required>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-space-sm">
            <div class="flex flex-col gap-1.5">
              <label class="text-label-md font-label-md text-on-surface" for="mother-age">Mother's Age</label>
              <div class="flex items-center bg-surface-container-low rounded-xl px-space-md h-12 shadow-sm focus-within:bg-surface-container-high transition-colors">
                <span class="material-symbols-outlined text-primary text-[20px] mr-space-sm shrink-0">cake</span>
                <input class="w-full bg-transparent text-body-lg font-body-lg text-on-surface placeholder:text-outline focus:outline-none" id="mother-age" placeholder="24" type="number" value="24" required>
              </div>
            </div>

            <div class="flex flex-col gap-1.5">
              <label class="text-label-md font-label-md text-on-surface" for="mother-village">Village / Location</label>
              <div class="flex items-center bg-surface-container-low rounded-xl px-space-md h-12 shadow-sm focus-within:bg-surface-container-high transition-colors">
                <span class="material-symbols-outlined text-primary text-[20px] mr-space-sm shrink-0">location_on</span>
                <input class="w-full bg-transparent text-body-lg font-body-lg text-on-surface placeholder:text-outline focus:outline-none" id="mother-village" placeholder="Village name" type="text" value="Kagando" required>
              </div>
            </div>
          </div>

          <div class="flex flex-col gap-1.5">
            <label class="text-label-md font-label-md text-on-surface" for="mother-phone">Mobile Phone Number</label>
            <div class="flex items-center bg-surface-container-low rounded-xl px-space-md h-12 shadow-sm focus-within:bg-surface-container-high transition-colors">
              <div class="flex items-center gap-1.5 pr-2.5 mr-2.5 border-r border-outline/20 shrink-0">
                <span class="material-symbols-outlined text-primary text-[18px]">call</span>
                <span class="text-label-md font-label-md text-on-surface font-semibold">+256</span>
              </div>
              <input class="w-full bg-transparent text-body-lg font-body-lg text-on-surface placeholder:text-outline focus:outline-none" id="mother-phone" placeholder="772 000 000" type="tel" value="772 345 678" required>
            </div>
          </div>

          <div class="flex flex-col gap-1.5">
            <label class="text-label-md font-label-md text-on-surface">Preferred Language for SMS Alerts</label>
            <div id="language-group" class="grid grid-cols-3 gap-2">
              <button type="button" data-lang="Luganda" class="lang-btn h-11 rounded-xl bg-surface-container-high text-primary font-label-md flex items-center justify-center gap-1 shadow-sm border border-primary/20">
                <span class="material-symbols-outlined text-[16px]">sms</span>
                <span>Luganda</span>
              </button>
              <button type="button" data-lang="English" class="lang-btn h-11 rounded-xl bg-surface-container-low text-on-surface-variant font-label-md flex items-center justify-center gap-1 shadow-sm hover:bg-surface-container">
                <span class="material-symbols-outlined text-[16px]">sms</span>
                <span>English</span>
              </button>
              <button type="button" data-lang="Swahili" class="lang-btn h-11 rounded-xl bg-surface-container-low text-on-surface-variant font-label-md flex items-center justify-center gap-1 shadow-sm hover:bg-surface-container">
                <span class="material-symbols-outlined text-[16px]">sms</span>
                <span>Swahili</span>
              </button>
            </div>
          </div>
        </section>

        <!-- Pregnancy & Health Section -->
        <section class="bg-surface-container-lowest rounded-2xl p-space-md shadow-sm flex flex-col gap-space-md border border-outline/20">
          <div class="flex items-center justify-between pb-1 border-b border-outline/20">
            <span class="text-label-sm font-label-sm uppercase tracking-wider text-primary font-semibold">Pregnancy &amp; Health</span>
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-label-md font-label-md text-on-surface">Current Maternal Status</label>
            <div aria-label="Current Status" class="grid grid-cols-2 gap-space-sm" role="radiogroup">
              <button aria-checked="true" class="h-14 px-3 rounded-xl flex items-center justify-center gap-2 bg-surface-container-high text-primary font-label-md shadow-sm border border-primary/30 transition-all" id="option-expecting" role="radio" type="button">
                <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">pregnant_woman</span>
                <span>Expecting</span>
              </button>
              <button aria-checked="false" class="h-14 px-3 rounded-xl flex items-center justify-center gap-2 bg-surface-container-low text-on-surface-variant font-label-md shadow-sm transition-all" id="option-baby" role="radio" type="button">
                <span class="material-symbols-outlined text-[20px]">child_care</span>
                <span>Newborn Baby</span>
              </button>
            </div>
          </div>

          <div id="pregnancy-stage-section" class="flex flex-col gap-1.5">
            <label class="text-label-md font-label-md text-on-surface">Stage / Pregnancy Month</label>
            <div id="stage-group" class="grid grid-cols-3 gap-2">
              <button type="button" data-stage="1 - 3 Mo" class="stage-btn h-11 rounded-xl bg-surface-container-low text-on-surface-variant font-label-md flex items-center justify-center">1 - 3 Mo</button>
              <button type="button" data-stage="4 - 6 Mo" class="stage-btn h-11 rounded-xl bg-surface-container-high text-primary font-label-md border border-primary/20 flex items-center justify-center font-semibold">4 - 6 Mo</button>
              <button type="button" data-stage="7 - 9 Mo" class="stage-btn h-11 rounded-xl bg-surface-container-low text-on-surface-variant font-label-md flex items-center justify-center">7 - 9 Mo</button>
            </div>
          </div>

          <div class="flex flex-col gap-1.5">
            <label class="text-label-md font-label-md text-on-surface">Number of Births (Parity)</label>
            <div id="parity-group" class="grid grid-cols-2 gap-space-sm">
              <button type="button" data-parity="First Baby (1st)" class="parity-btn h-11 rounded-xl bg-surface-container-high text-primary font-label-md border border-primary/20 flex items-center justify-center gap-1.5 font-semibold">
                <span>First Baby (1st)</span>
              </button>
              <button type="button" data-parity="2nd or More" class="parity-btn h-11 rounded-xl bg-surface-container-low text-on-surface-variant font-label-md flex items-center justify-center gap-1.5">
                <span>2nd or More</span>
              </button>
            </div>
          </div>

          <div class="flex flex-col gap-1.5">
            <label class="text-label-md font-label-md text-on-surface">Any Known Health Conditions?</label>
            <div id="condition-group" class="flex flex-wrap gap-2">
              <button type="button" data-condition="None" class="cond-btn px-3 h-9 rounded-full bg-surface-container-high text-primary border border-primary/20 text-label-sm font-label-sm flex items-center gap-1">
                <span class="material-symbols-outlined text-[14px]">check</span>
                <span>None</span>
              </button>
              <button type="button" data-condition="High BP" class="cond-btn px-3 h-9 rounded-full bg-surface-container-low text-on-surface-variant text-label-sm font-label-sm flex items-center gap-1 hover:bg-surface-container">
                <span class="material-symbols-outlined text-[14px]">monitor_heart</span>
                <span>High BP</span>
              </button>
              <button type="button" data-condition="Anemia" class="cond-btn px-3 h-9 rounded-full bg-surface-container-low text-on-surface-variant text-label-sm font-label-sm flex items-center gap-1 hover:bg-surface-container">
                <span class="material-symbols-outlined text-[14px]">bloodtype</span>
                <span>Anemia</span>
              </button>
              <button type="button" data-condition="Other" class="cond-btn px-3 h-9 rounded-full bg-surface-container-low text-on-surface-variant text-label-sm font-label-sm flex items-center gap-1 hover:bg-surface-container">
                <span class="material-symbols-outlined text-[14px]">medication</span>
                <span>Other</span>
              </button>
            </div>
          </div>
        </section>

        <!-- Save Button -->
        <div class="flex flex-col gap-3 mt-2">
          <button id="btn-submit-registration" class="w-full h-14 rounded-full bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md hover:opacity-95 active:scale-[0.99] transition-all" type="submit">
            <span>Save &amp; Continue</span>
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
          </button>
          <p class="text-center text-label-sm font-label-sm text-on-surface-variant flex items-center justify-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-primary shrink-0"></span>
            <span>Works offline • Free *920# access</span>
          </p>
        </div>

      </div>
    </form>
  </div>
</main>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // State
    let selectedStatus = 'expecting';
    let selectedLanguage = 'Luganda';
    let selectedStage = '4 - 6 Mo';
    let selectedParity = 'First Baby (1st)';
    let selectedConditions = ['None'];
    let photoDataUrl = '';

    // Status toggle
    const optExpecting = document.getElementById('option-expecting');
    const optBaby = document.getElementById('option-baby');
    const stageSection = document.getElementById('pregnancy-stage-section');

    if (optExpecting && optBaby && stageSection) {
      optExpecting.addEventListener('click', () => {
        selectedStatus = 'expecting';
        optExpecting.className = 'h-14 px-3 rounded-xl flex items-center justify-center gap-2 bg-surface-container-high text-primary font-label-md shadow-sm border border-primary/30 transition-all';
        optBaby.className = 'h-14 px-3 rounded-xl flex items-center justify-center gap-2 bg-surface-container-low text-on-surface-variant font-label-md shadow-sm transition-all';
        optExpecting.setAttribute('aria-checked', 'true');
        optBaby.setAttribute('aria-checked', 'false');
        stageSection.style.display = 'flex';
      });

      optBaby.addEventListener('click', () => {
        selectedStatus = 'baby';
        optBaby.className = 'h-14 px-3 rounded-xl flex items-center justify-center gap-2 bg-surface-container-high text-primary font-label-md shadow-sm border border-primary/30 transition-all';
        optExpecting.className = 'h-14 px-3 rounded-xl flex items-center justify-center gap-2 bg-surface-container-low text-on-surface-variant font-label-md shadow-sm transition-all';
        optBaby.setAttribute('aria-checked', 'true');
        optExpecting.setAttribute('aria-checked', 'false');
        stageSection.style.display = 'none';
      });
    }

    // Photo input
    const photoFileInput = document.getElementById('photo-file-input');
    const photoPreviewImg = document.getElementById('photo-preview-img');
    const photoPlaceholderIcon = document.getElementById('photo-placeholder-icon');
    const photoBtnText = document.getElementById('photo-btn-text');

    if (photoFileInput) {
      photoFileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (uploadEvent) => {
            photoDataUrl = uploadEvent.target.result;
            photoPreviewImg.src = photoDataUrl;
            photoPreviewImg.classList.remove('hidden');
            photoPlaceholderIcon.classList.add('hidden');
            photoBtnText.textContent = 'Change Photo';
          };
          reader.readAsDataURL(file);
        }
      });
    }

    // Language buttons
    const langBtns = document.querySelectorAll('.lang-btn');
    langBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        langBtns.forEach(b => {
          b.className = 'lang-btn h-11 rounded-xl bg-surface-container-low text-on-surface-variant font-label-md flex items-center justify-center gap-1 shadow-sm hover:bg-surface-container';
        });
        btn.className = 'lang-btn h-11 rounded-xl bg-surface-container-high text-primary font-label-md flex items-center justify-center gap-1 shadow-sm border border-primary/20';
        selectedLanguage = btn.getAttribute('data-lang');
      });
    });

    // Stage buttons
    const stageBtns = document.querySelectorAll('.stage-btn');
    stageBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        stageBtns.forEach(b => {
          b.className = 'stage-btn h-11 rounded-xl bg-surface-container-low text-on-surface-variant font-label-md flex items-center justify-center';
        });
        btn.className = 'stage-btn h-11 rounded-xl bg-surface-container-high text-primary font-label-md border border-primary/20 flex items-center justify-center font-semibold';
        selectedStage = btn.getAttribute('data-stage');
      });
    });

    // Parity buttons
    const parityBtns = document.querySelectorAll('.parity-btn');
    parityBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        parityBtns.forEach(b => {
          b.className = 'parity-btn h-11 rounded-xl bg-surface-container-low text-on-surface-variant font-label-md flex items-center justify-center gap-1.5';
        });
        btn.className = 'parity-btn h-11 rounded-xl bg-surface-container-high text-primary font-label-md border border-primary/20 flex items-center justify-center gap-1.5 font-semibold';
        selectedParity = btn.getAttribute('data-parity');
      });
    });

    // Condition buttons
    const condBtns = document.querySelectorAll('.cond-btn');
    condBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const cond = btn.getAttribute('data-condition');
        if (cond === 'None') {
          selectedConditions = ['None'];
          condBtns.forEach(b => {
            b.className = 'cond-btn px-3 h-9 rounded-full bg-surface-container-low text-on-surface-variant text-label-sm font-label-sm flex items-center gap-1 hover:bg-surface-container';
          });
          btn.className = 'cond-btn px-3 h-9 rounded-full bg-surface-container-high text-primary border border-primary/20 text-label-sm font-label-sm flex items-center gap-1';
        } else {
          selectedConditions = selectedConditions.filter(c => c !== 'None');
          const noneBtn = Array.from(condBtns).find(b => b.getAttribute('data-condition') === 'None');
          if (noneBtn) {
            noneBtn.className = 'cond-btn px-3 h-9 rounded-full bg-surface-container-low text-on-surface-variant text-label-sm font-label-sm flex items-center gap-1 hover:bg-surface-container';
          }
          if (selectedConditions.includes(cond)) {
            selectedConditions = selectedConditions.filter(c => c !== cond);
            btn.className = 'cond-btn px-3 h-9 rounded-full bg-surface-container-low text-on-surface-variant text-label-sm font-label-sm flex items-center gap-1 hover:bg-surface-container';
            if (selectedConditions.length === 0) {
              selectedConditions = ['None'];
              if (noneBtn) {
                noneBtn.className = 'cond-btn px-3 h-9 rounded-full bg-surface-container-high text-primary border border-primary/20 text-label-sm font-label-sm flex items-center gap-1';
              }
            }
          } else {
            selectedConditions.push(cond);
            btn.className = 'cond-btn px-3 h-9 rounded-full bg-surface-container-high text-primary border border-primary/20 text-label-sm font-label-sm flex items-center gap-1';
          }
        }
      });
    });

    // Form Submission & Redirect to Dashboard
    const regForm = document.getElementById('registration-form');
    if (regForm) {
      regForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const fullName = (document.getElementById('mother-name').value || '').trim() || 'Amina Brenda';
        const age = (document.getElementById('mother-age').value || '').trim() || '24';
        const village = (document.getElementById('mother-village').value || '').trim() || 'Kagando';
        const phone = (document.getElementById('mother-phone').value || '').trim() || '772 000 000';

        const motherProfile = {
          fullName,
          age,
          village,
          phone: '+256 ' + phone,
          language: selectedLanguage,
          status: selectedStatus,
          stage: selectedStage,
          parity: selectedParity,
          conditions: selectedConditions,
          photoDataUrl: photoDataUrl || ''
        };

        // Save profile to localStorage
        localStorage.setItem('babyhealth_mother_profile', JSON.stringify(motherProfile));
        sessionStorage.setItem('bhg_just_registered', 'true');

        // Button loading state
        const submitBtn = document.getElementById('btn-submit-registration');
        submitBtn.innerHTML = '<span>Saving Profile...</span>';
        submitBtn.disabled = true;

        // Redirect to Mother Dashboard
        setTimeout(() => {
          window.location.href = 'dashboard_preview.html';
        }, 350);
      });
    }
  });
</script>

</body>
</html>
