<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>BabyHealth Guard - Welcome</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans for friendly, modern aesthetic -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            sand: {
              50: '#FDFBF7',
              100: '#FBF7F0',
              200: '#F5ECE0',
            },
            warmgold: {
              400: '#F6C343',
              500: '#EBB42C',
            },
            sage: {
              600: '#3A6856',
            }
          },
          boxShadow: {
            'soft': '0 20px 40px -15px rgba(215, 178, 142, 0.28)',
            'pill': '0 8px 24px -4px rgba(246, 195, 67, 0.4)',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="base-styling">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    /* Hide scrollbars */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
<style data-purpose="interactive-animations">
    @keyframes pulse-subtle {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 2.5s infinite ease-in-out;
    }
    .slide-arrow-shimmer {
      display: inline-block;
      animation: arrow-slide 1.6s infinite ease-in-out;
    }
    @keyframes arrow-slide {
      0%, 100% { transform: translateX(0); opacity: 0.5; }
      50% { transform: translateX(4px); opacity: 1; }
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="bg-stone-100 flex items-center justify-center min-h-screen p-0 sm:p-4 text-stone-800 antialiased selection:bg-amber-100">
<!-- BEGIN: MobileDeviceFrame -->
<main class="w-full max-w-[400px] h-[100dvh] sm:h-[844px] bg-gradient-to-b sm:rounded-[48px] shadow-2xl relative flex flex-col justify-between overflow-hidden border-0 sm:border-[8px] sm:border-stone-900/10" data-purpose="onboarding-screen" style="background: linear-gradient(180deg, #faf8ff 0%, #f2f3ff 60%, #eaedff 100%);">
<!-- Ambient background soft pastel glow rings -->
<div aria-hidden="true" class="absolute -top-24 -right-20 w-80 h-80 bg-orange-100/50 rounded-full blur-3xl pointer-events-none" style="background-color: rgba(211, 241, 255, 0.45);"></div>
<div aria-hidden="true" class="absolute top-1/2 -left-32 w-72 h-72 bg-amber-100/40 rounded-full blur-3xl pointer-events-none" style="background-color: rgba(218, 226, 253, 0.4);"></div>
<!-- BEGIN: TopSection -->
<header class="w-full z-10 pt-3 px-7 shrink-0">
<!-- iOS Status Bar -->
<div class="flex justify-between items-center text-stone-800 text-xs font-semibold tracking-tight pt-1 pb-3" data-purpose="status-bar">
<span class="tracking-tight text-[15px] font-bold">9:41</span>
<div class="flex items-center space-x-2">
<!-- Cellular Signal -->
<svg class="w-4 h-3.5 fill-current" fill="none" viewBox="0 0 17 12" xmlns="http://www.w3.org/2000/svg">
<rect height="4" rx="1" width="3" y="8"></rect>
<rect height="6.5" rx="1" width="3" x="4.5" y="5.5"></rect>
<rect height="9" rx="1" width="3" x="9" y="3"></rect>
<rect height="11.5" rx="1" width="3" x="13.5" y="0.5"></rect>
</svg>
<!-- Wi-Fi -->
<svg class="w-3.5 h-3.5 fill-current" fill="none" viewBox="0 0 16 12" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M8 2.2C10.6 2.2 12.9 3.2 14.7 4.9L16 3.6C13.9 1.5 11.1 0.2 8 0.2C4.9 0.2 2.1 1.5 0 3.6L1.3 4.9C3.1 3.2 5.4 2.2 8 2.2ZM8 6.2C9.5 6.2 10.9 6.8 11.9 7.8L13.2 6.5C11.9 5.1 10 4.2 8 4.2C6 4.2 4.1 5.1 2.8 6.5L4.1 7.8C5.1 6.8 6.5 6.2 8 6.2ZM8 10.2C8.7 10.2 9.3 10.5 9.8 11L8 12.8L6.2 11C6.7 10.5 7.3 10.2 8 10.2Z" fill-rule="evenodd"></path>
</svg>
<!-- Battery -->
<div class="flex items-center">
<div class="w-5 h-2.5 border border-stone-800 rounded-[4px] p-0.5 flex items-center">
<div class="h-full w-full bg-stone-800 rounded-[1.5px]"></div>
</div>
<div class="w-0.5 h-1 bg-stone-800 rounded-r-sm -ml-[0.5px]"></div>
</div>
</div>
</div>
<!-- Welcome Headline and Warm Subtext -->
<div class="pt-4 pb-1" data-purpose="screen-title">
<h1 class="text-[31px] leading-[1.18] font-extrabold tracking-tight text-stone-900 max-w-[280px]">
          Welcome to<br>BabyHealth Guard
        </h1>
<p class="mt-2 text-stone-600 text-[14.5px] font-medium leading-relaxed max-w-[270px]">
          Simple health monitoring and midwife care for you and your baby.
        </p>
</div>
</header>
<!-- END: TopSection -->
<!-- BEGIN: HeroVisual -->
<!-- Warm mother & baby portrait mirroring reference layout with gentle organic shadow -->
<div class="relative w-full flex items-center justify-center my-auto px-6 z-10" data-purpose="hero-container">
<div class="relative w-full max-w-[310px] aspect-[4/4.3] rounded-[36px] overflow-hidden shadow-soft border-4 border-white/80 bg-white/40">
<img alt="Cute healthy baby sleeping calmly" class="w-full h-full object-cover object-center transform hover:scale-102 transition-transform duration-700 ease-out" loading="eager" src="assets/images/baby_welcome.jpg" onerror="this.onerror=null; this.src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRk1GQMu_bW71W1HLqqmPdjA13C31PmXR4giZ3cgQzaaVEDOhJOdxSpMjkF&s=10';">
<!-- Subtle glass gradient overlay at bottom edge of portrait for gentle blend -->
<div class="absolute inset-x-0 bottom-0 h-16 bg-gradient-to-t from-black/15 via-black/5 to-transparent pointer-events-none"></div>
</div>
</div>
<!-- END: HeroVisual -->
<!-- BEGIN: BottomActionSection -->
<footer class="w-full px-6 pb-6 pt-2 z-10 shrink-0 flex flex-col items-center gap-3" data-purpose="bottom-controls">
<!-- Interactive "Get Started" Pill Button Styled like Reference Image Slider -->
<button aria-label="Get Started with BabyHealth Guard" class="group relative w-full h-[62px] bg-white/95 rounded-full p-2 pl-2 pr-5 flex items-center justify-between shadow-[0_10px_25px_rgba(215,185,150,0.35)] border border-stone-100 hover:bg-white active:scale-[0.99] transition-all duration-200 cursor-pointer overflow-hidden" id="btn-get-started" type="button">
<!-- Golden circular indicator with arrow icon -->
<div class="h-[46px] w-[46px] rounded-full bg-[#0e7490] shadow-md flex items-center justify-center text-white shrink-0 transform group-hover:translate-x-1 transition-transform duration-300"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></div>
<!-- Center Label Text -->
<span class="text-stone-900 text-[16px] font-bold tracking-tight select-none">
          Get Started
        </span>
<!-- Trailing Chevron Triple Arrows mirroring Reference (>>>) -->
<div class="flex items-center text-[#0e7490] font-bold tracking-tighter text-sm slide-arrow-shimmer"><svg class="w-4 h-4 -mr-2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg><svg class="w-4 h-4 -mr-2 opacity-80" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg><svg class="w-4 h-4 opacity-50" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></div>
</button>
<!-- Offline and USSD accessibility indicator for rural mothers -->
<div class="flex items-center justify-center gap-2 text-stone-600 text-[12px] font-medium tracking-normal py-1" data-purpose="accessibility-tag">
<span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse-subtle"></span>
<span class="">Works offline</span>
<span class="text-stone-400 font-light">•</span>
<span class="text-stone-700 font-semibold bg-stone-200/50 px-2 py-0.5 rounded-md tracking-wider">Free *920# access</span>
</div>
<!-- iOS Home Bar Indicator -->
<div aria-hidden="true" class="w-32 h-1 bg-stone-800/20 rounded-full mt-1"></div>
</footer>
<!-- END: BottomActionSection -->
</main>
<!-- END: MobileDeviceFrame -->
<!-- BEGIN: Interactive Feedback Script -->
<script data-purpose="button-feedback">
    document.addEventListener('DOMContentLoaded', () => {
      const getStartedBtn = document.getElementById('btn-get-started');
      if (getStartedBtn) {
        getStartedBtn.addEventListener('click', () => {
          // Subtle tap response for mobile web
          getStartedBtn.classList.add('scale-95');
          setTimeout(() => {
            getStartedBtn.classList.remove('scale-95');
          }, 150);
        });
      }
    });
  </script>
<!-- END: Interactive Feedback Script -->
</body></html>
