<!-- BEGIN: Interactive Feedback Script -->
<script data-purpose="button-feedback">
    document.addEventListener('DOMContentLoaded', () => {
      const getStartedBtn = document.getElementById('btn-get-started');
      if (getStartedBtn) {
        getStartedBtn.addEventListener('click', () => {
          // Tap response & navigate to registration preview
          getStartedBtn.classList.add('scale-95');
          setTimeout(() => {
            getStartedBtn.classList.remove('scale-95');
            window.location.href = 'registration_preview.html';
          }, 150);
        });
      }
    });
  </script>
<!-- END: Interactive Feedback Script -->

<script>
// Universal Back / Forward / View Navigation Logic
function navigateBack() {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.href = '/index.html';
  }
}

function navigateForward() {
  window.history.forward();
}

function quickNavigate(path) {
  window.location.href = path;
}
</script>
